name: myex_app
description: "MyEx: breakup recovery with Mira, a 30-day plan, no-contact streak, SOS and Draft Jail."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  supabase_flutter: ^2.18.3
  purchases_flutter: ^11.0.3
  # Pinned by flutter_localizations (SDK) — do not bump independently.
  intl: ^0.20.2
  uuid: ^4.6.0
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  flutter_timezone: ^5.1.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Fonts (OFL, bundled, never fetched at runtime). UI text uses the system
  # font (SF Pro on iOS). Instrument Serif is only for one display headline per
  # emotional screen and hero numerals, upright only. License: assets/fonts/OFL.txt
  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
    # Fraunces (OFL), static instance: opsz 72, wght 620, SOFT 100, WONK 0.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/FrauncesSoft-SemiBold.ttf
